<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hero XP v3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#291937,#5d3c54,#17101f);color:#fff7dc;font-family:Arial;min-height:100vh}header{text-align:center;padding:16px;background:#1d1228;border-bottom:4px solid #d2a440}h1{margin:0;color:#f4c95d;font:900 44px Georgia}.sub{margin:5px}.pillars{font-weight:bold;color:#e8d49e;font-size:12px}
nav{position:sticky;top:0;z-index:5;background:#30203b;padding:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}button{padding:9px 11px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.xp{background:#f4c95d}.sp{background:#74519a;color:white}.util{background:#eee}
main{max-width:1500px;margin:auto;padding:14px}.quest{text-align:center;border:2px solid #9f7936;background:#24172e;border-radius:12px;padding:8px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:11px}.card{background:#fff7dc;color:#291d17;border:3px solid #b88932;border-radius:16px;padding:11px;box-shadow:0 5px 14px #0008;cursor:pointer}.card.sel{outline:5px solid white}.avatar{float:left;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#553773;color:white;border:3px solid #c7983e;font:900 20px Georgia;margin-right:8px}.name{font:900 21px Georgia}.camp{font-size:11px;color:#735b34}.clear{clear:both}.row{display:flex;justify-content:space-between;margin:8px 0 5px;font-weight:900}.level{background:#3e2954;color:white;padding:4px 8px;border-radius:15px;font-size:12px}.bar{height:14px;background:#cbbda4;border-radius:15px;overflow:hidden}.fill{height:100%;background:#73509a}.meta{font-size:11px;margin-top:5px}.badges{min-height:22px;margin-top:5px}.money{float:right;font-size:11px;font-weight:bold}
.panel{display:none;position:fixed;right:12px;bottom:12px;background:#fff7dc;color:#291d17;border:4px solid #c29237;border-radius:15px;padding:13px;width:min(430px,calc(100vw - 24px));z-index:10}.panel.open{display:block}.panel input,.panel select{width:100%;padding:8px;margin:4px 0}.panel button{margin:3px}
.overlay{display:none;position:fixed;inset:0;background:#000c;z-index:20;place-items:center}.modal{background:#fff7dc;color:#291d17;border:8px double #c29237;border-radius:25px;padding:35px;text-align:center;max-width:800px}.hero{font:900 60px Georgia;color:#604080}.big{font:900 32px Georgia}.toast{display:none;position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:30;background:#fff7dc;color:#291d17;border:4px solid #f4c95d;border-radius:15px;padding:15px 24px;font:900 21px Georgia}
</style></head><body>
<header><h1>⚡ HERO XP COMMAND CENTER ⚡</h1><div class="sub">Going the Distance in 5th Grade • Dr. Castleberry</div><div class="pillars">PURPOSE • ADVENTURE • DEFYING GRAVITY • GO THE DISTANCE</div></header>
<nav><button class="xp" onclick="award(5,'On Time')">⏰ +5 On Time</button><button class="xp" onclick="participationAward()">🙋 +2 XP / $2 Participation</button><button class="xp" onclick="award(3,'CHAMPS')">🏛 +3 CHAMPS</button><button class="xp" onclick="award(5,'Work Complete')">📜 +5 Work</button><button class="xp" onclick="award(10,'Gold Coin')">🪙 +10 Gold Coin</button><button class="xp" onclick="award(10,'Caught in Seat')">⚡ +10 In Seat</button><button class="sp" onclick="heroMoment()">🌟 Hero Moment</button><button class="sp" onclick="randomHero()">🎲 Random Hero</button>
<button class="sp" onclick="quest()">🗺️ Quest</button>
<button class="sp" onclick="titanBattle()">⚔️ Titan Battle</button>
<button class="sp" onclick="training()">🏟️ Training Grounds</button><button class="util" onclick="undo()">↶ Undo</button><button class="util" onclick="teacher()">⚙ Teacher</button><button class="util" onclick="fullscreen()">⛶ Project</button><button class="util" onclick="selectAll()">✓ Select All</button><button class="util" onclick="clearSelection()">✕ Clear</button><button class="sp" onclick="openTimer()">⏱ Timer</button><button class="util" id="soundBtn" onclick="toggleSound()">🔊 Sound On</button></nav>
<main><div class="quest">⚔️ <b>CLASS QUEST</b> • <span id="classXP"></span></div><div id="msg" style="text-align:center;font-weight:bold;margin-bottom:10px">Select a hero to begin.</div><div class="grid" id="grid"></div></main>
<div class="panel" id="timerPanel"><h2>⏱ Teacher Timer</h2><div id="timerDisplay" style="font:900 52px Georgia;text-align:center;margin:12px">05:00</div><div style="display:flex;gap:5px;flex-wrap:wrap"><button onclick="setTimer(60)">1 min</button><button onclick="setTimer(120)">2 min</button><button onclick="setTimer(300)">5 min</button><button onclick="setTimer(600)">10 min</button><button onclick="setTimer(900)">15 min</button><button onclick="setTimer(1200)">20 min</button></div><input id="customMinutes" type="number" min="1" max="120" placeholder="Custom minutes"><button class="sp" onclick="setCustomTimer()">Set</button><button class="sp" onclick="startTimer()">▶ Start</button><button onclick="pauseTimer()">Ⅱ Pause</button><button onclick="resetTimer()">↺ Reset</button><button onclick="openTimer()">Close</button></div><div class="panel" id="gamepanel"><h2 id="gameTitle">⚔️ Hero Adventure</h2><div id="gameBody"></div><button class="util" onclick="closeGame()">Close</button></div><div class="panel" id="panel"><h2>⚙ Teacher Command Panel</h2><div id="info">Select a hero.</div><input id="exact" type="number" placeholder="Set exact XP"><input id="dollars" type="number" placeholder="Set Hero Dollars"><select id="camp"><option>Hera</option><option>Poseidon</option><option>Demeter</option><option>Athena</option><option>Apollo</option><option>Artemis</option><option>Ares</option><option>Aphrodite</option><option>Hephaestus</option><option>Hermes</option><option>Hades</option><option>Dionysus</option></select><br><button class="sp" onclick="setHero()">Save Hero</button><button class="sp" onclick="custom()">Custom XP</button><div style="width:100%;margin-top:7px"><b>💰 Award Hero Dollars</b></div><button onclick="giveDollars(1)">$1</button><button onclick="giveDollars(2)">$2</button><button onclick="giveDollars(5)">$5</button><button onclick="giveDollars(10)">$10</button><button onclick="giveDollars(20)">$20</button><button onclick="giveDollars(50)">$50</button><button onclick="giveDollars(100)">$100</button><button onclick="backup()">Backup</button><button onclick="document.getElementById('load').click()">Load</button><button onclick="teacher()">Close</button><input id="load" hidden type="file" accept=".json" onchange="restore(event)"></div>
<div class="toast" id="toast"></div><div class="overlay" id="overlay" onclick="this.style.display='none'"><div class="modal"><div>⚡ 🏛️ ⚡</div><div class="hero" id="mh"></div><div class="big" id="mt"></div><p id="ms"></p></div></div>
<script>
const LEVEL_XP=[0,99,201,304,408,513,619,725,832,940,1099,1259,1420,1582,1745,1909,2074,2240,2407,2575,2794,3014,3235,3457,3680,3904,4129,4355,4582,4810,5189,5569,5950,6332,6715,7099,7484,7870,8257,8645,9083,9522,9962,10403,10845,11288,11732,12177,12623,13070,13567,14065,14564,15064,15565,16067,16570,17074,17579,18085,18641,19198,19756,20315,20875,21436,21998,22561,23125,23690,24305,24921,25538,26156,26775,27395,28016,28638,29261,29885,30559,31234,31910,32587,33265,33944,34624,35305,35987,36669,37402,38136,38871,39607,40344,41082,41821,42561,43302,44302];
const defaults=[{"name":"Olga","xp":1499,"heroDollars":0,"camp":"Hera"},{"name":"DJ","xp":1697,"heroDollars":0,"camp":"Poseidon"},{"name":"Matteo","xp":1699,"heroDollars":0,"camp":"Demeter"},{"name":"Genesis","xp":1719,"heroDollars":0,"camp":"Athena"},{"name":"Ali","xp":1988,"heroDollars":0,"camp":"Apollo"},{"name":"Yaretzi","xp":2126,"heroDollars":0,"camp":"Artemis"},{"name":"Marlee","xp":1735,"heroDollars":0,"camp":"Ares"},{"name":"Felix","xp":1492,"heroDollars":0,"camp":"Aphrodite"},{"name":"Yamileth","xp":2023,"heroDollars":0,"camp":"Hephaestus"},{"name":"Tamsin","xp":2217,"heroDollars":0,"camp":"Hermes"},{"name":"Keywine","xp":1835,"heroDollars":0,"camp":"Hades"},{"name":"Amodd","xp":1650,"heroDollars":0,"camp":"Dionysus"},{"name":"Zah'Khrya","xp":1539,"heroDollars":0,"camp":"Hera"},{"name":"Jakale","xp":2093,"heroDollars":0,"camp":"Poseidon"},{"name":"Dali","xp":1582,"heroDollars":0,"camp":"Demeter"},{"name":"Nelson","xp":1127,"heroDollars":0,"camp":"Athena"},{"name":"Harleen","xp":1579,"heroDollars":0,"camp":"Apollo"},{"name":"Z'Cari","xp":1813,"heroDollars":0,"camp":"Artemis"},{"name":"Cameron","xp":1728,"heroDollars":0,"camp":"Ares"},{"name":"Jazden","xp":1232,"heroDollars":0,"camp":"Aphrodite"},{"name":"Jesus","xp":1662,"heroDollars":0,"camp":"Hephaestus"},{"name":"Jesse","xp":2212,"heroDollars":0,"camp":"Hermes"},{"name":"Emery","xp":1807,"heroDollars":0,"camp":"Hades"},{"name":"Khuong","xp":2343,"heroDollars":0,"camp":"Dionysus"},{"name":"Gerald","xp":1943,"heroDollars":0,"camp":"Hera"}];let students=JSON.parse(localStorage.getItem('heroXPv8')||'null')||JSON.parse(localStorage.getItem('heroXPv7')||'null')||JSON.parse(localStorage.getItem('heroXPv6')||'null')||defaults,selected=new Set(),history=[],timerId=null,timerRemaining=300,soundOn=true;
function L(x){
 let l=1;
 for(let i=0;i<LEVEL_XP.length;i++){if(x>=LEVEL_XP[i])l=i+1;else break}
 if(l>=100)return {l:100,p:100,r:0};
 let start=LEVEL_XP[l-1],next=LEVEL_XP[l],span=next-start;
 return {l:l,p:Math.max(0,Math.min(100,Math.round((x-start)/span*100))),r:Math.max(0,next-x)}
}
function milestone(l){if(l==100)return'🏆 HERO OF OLYMPUS';if(l==75)return'⚔️ LEGENDARY TRIAL';if(l==50)return'🛡️ HALFWAY HERO';if(l==25)return'🏺 FIRST TRIAL';if(l%10==0)return'⭐ MILESTONE HERO';return''}
function badges(l){let b=[];if(l>=10)b.push('⭐');if(l>=25)b.push('🏺');if(l>=50)b.push('🛡️');if(l>=75)b.push('⚔️');if(l>=100)b.push('🏆');return b.join(' ')}
function save(){localStorage.setItem('heroXPv8',JSON.stringify(students))}
function render(){let g=document.getElementById('grid'),total=0;g.innerHTML='';students.forEach((s,i)=>{total+=s.xp;let q=L(s.xp),d=document.createElement('div');d.className='card'+(selected.has(i)?' sel':'');d.onclick=()=>select(i);d.innerHTML=`<div class="money">💰 ${s.heroDollars||0}</div><div class="avatar">${s.name[0]}</div><div class="name">${s.name}</div><div class="camp">Base Camp: ${s.camp}</div><div class="clear"></div><div class="row"><span>${s.xp.toLocaleString()} XP</span><span class="level">LEVEL ${q.l}</span></div><div class="bar"><div class="fill" style="width:${q.p}%"></div></div><div class="meta">${q.l==100?'MAX LEVEL':q.p+'% • '+q.r+' XP to next level'}</div><div class="badges">${badges(q.l)}</div>`;g.appendChild(d)});document.getElementById('classXP').textContent='Class Total: '+total.toLocaleString()+' XP';info()}
function select(i){if(selected.has(i))selected.delete(i);else selected.add(i);render();document.getElementById('msg').textContent=selected.size?'Selected Heroes: '+[...selected].map(i=>students[i].name).join(', '):'Select a hero to begin.'}
function selectAll(){selected=new Set(students.map((_,i)=>i));render();document.getElementById('msg').textContent='All heroes selected.'}
function clearSelection(){selected.clear();render();document.getElementById('msg').textContent='Selection cleared.'}
function snap(){history.push(JSON.stringify(students));if(history.length>40)history.shift()}
function participationAward(){
 if(!selected.size)return toast('Select one or more heroes first.');
 snap();let leveled=[];
 selected.forEach(i=>{
   let st=students[i],before=L(st.xp).l;
   st.xp+=2;
   st.heroDollars=(st.heroDollars||0)+2;
   let after=L(st.xp).l;
   if(after>before)leveled.push([st.name,after]);
 });
 save();render();playXPSound();playCoinSound();
 if(leveled.length){
   playLevelSound();
   let names=leveled.map(x=>x[0]+' — Level '+x[1]).join(' • ');
   celebrate('LEVEL UP!','🙋 PARTICIPATION REWARD',names+' • +2 XP and +$2 Hero Dollars');
 } else {
   toast('🙋 Each selected hero earned +2 XP and +$2 Hero Dollars!');
 }
}
function award(p,r){if(!selected.size)return toast('Select one or more heroes first.');snap();let leveled=[];selected.forEach(i=>{let st=students[i],b=L(st.xp).l;st.xp+=p;let a=L(st.xp).l;if(a>b)leveled.push(st.name+' — Level '+a)});save();render();playXPSound();if(leveled.length){playLevelSound();celebrate('LEVEL UP!','⚡ HEROES ASCEND! ⚡',leveled.join(' • '))}else toast('⚡ '+selected.size+' hero'+(selected.size>1?'es':'')+' +'+p+' XP • '+r)}
function heroMoment(){if(!selected.size)return toast('Select one or more heroes first.');snap();selected.forEach(i=>students[i].xp+=10);save();render();playXPSound();celebrate('HERO MOMENT!','🌟 GOING THE DISTANCE!','+10 XP for '+selected.size+' hero'+(selected.size>1?'es':''))}
function randomHero(){let i=Math.floor(Math.random()*students.length);selected=new Set([i]);render();document.getElementById('msg').textContent='Selected Hero: '+students[i].name;celebrate(students[i].name,'🎲 THE FATES HAVE CHOSEN!','Your hero has been selected.')}
function undo(){if(!history.length)return toast('Nothing to undo.');students=JSON.parse(history.pop());save();render();toast('Last change undone.')}
function teacher(){document.getElementById('panel').classList.toggle('open');info()}
function info(){let box=document.getElementById('info');if(!box)return;if(selected.size!==1){box.innerHTML=selected.size?'<b>'+selected.size+' heroes selected.</b><br>Exact XP/Base Camp editing requires one hero.':'Select one hero for individual editing.';return}let i=[...selected][0],st=students[i];box.innerHTML='<b>'+st.name+'</b> • '+st.xp+' XP • Level '+L(st.xp).l;document.getElementById('camp').value=st.camp}
function setHero(){if(selected.size!==1)return toast('Select exactly one hero.');snap();let idx=[...selected][0],s=students[idx],x=document.getElementById('exact').value,d=document.getElementById('dollars').value;if(x!=='')s.xp=Math.max(0,Math.round(Number(x)));if(d!=='')s.heroDollars=Math.max(0,Math.round(Number(d)));s.camp=document.getElementById('camp').value;save();render();toast('Hero updated.')}
function custom(){if(!selected.size)return toast('Select one or more heroes.');let v=Number(prompt('XP amount:'));if(!Number.isFinite(v)||v===0)return;snap();selected.forEach(i=>students[i].xp=Math.max(0,students[i].xp+v));save();render();playXPSound();toast(selected.size+' hero'+(selected.size>1?'es':'')+' '+(v>0?'+':'')+v+' XP')}
function giveDollars(v){if(!selected.size)return toast('Select one or more heroes.');snap();selected.forEach(i=>students[i].heroDollars=(students[i].heroDollars||0)+v);save();render();playCoinSound();toast('💰 '+selected.size+' hero'+(selected.size>1?'es':'')+' +$'+v+' Hero Dollars')}
function celebrate(n,t,s){document.getElementById('mh').textContent=n.toUpperCase();document.getElementById('mt').textContent=t;document.getElementById('ms').textContent=s;document.getElementById('overlay').style.display='grid'}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.z);window.z=setTimeout(()=>e.style.display='none',1800)}
function fullscreen(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(students,null,2)],{type:'application/json'}));a.download='hero-xp-v3-backup.json';a.click()}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{snap();students=JSON.parse(r.result);save();render();toast('Backup restored.')}catch{toast('Could not read backup.')}};r.readAsText(f)}

const quests=[
["Temple of Focus","Class completes a work block using CHAMPS expectations.",25],
["Scrolls of Completion","Selected hero completes the assigned mission.",10],
["Oracle's Challenge","Selected hero explains their thinking clearly.",10],
["Bridge of Perseverance","Selected hero keeps working through a difficult task.",15],
["Culture of WE","Selected hero helps the class community succeed.",10],
["Secret Quest","A mystery challenge chosen by the teacher.",20]
];
const titans=[
["Titan of Distraction",50,"Defeat the Titan by showing focused participation during the challenge."],
["Titan of Incomplete Work",50,"Defeat the Titan by completing the assigned mission with quality effort."],
["Titan of Giving Up",75,"Defeat the Titan by revising, retrying, and persevering."],
["Chronos, Keeper of Time",50,"Defeat Chronos by being ready and completing the mission within the time limit."]
];
function openGame(title,body){document.getElementById('gameTitle').textContent=title;document.getElementById('gameBody').innerHTML=body;document.getElementById('gamepanel').classList.add('open')}
function closeGame(){document.getElementById('gamepanel').classList.remove('open')}
function quest(){let q=quests[Math.floor(Math.random()*quests.length)];openGame('🗺️ QUEST: '+q[0],`<p>${q[1]}</p><p><b>Reward: +${q[2]} XP</b></p><button class="sp" id="winQuest">Complete Quest</button>`);document.getElementById('winQuest').addEventListener('click',()=>{if(!selected.size)return toast('Select one or more heroes who completed the quest.');award(q[2],q[0]);closeGame()})}
function titanBattle(){let t=titans[Math.floor(Math.random()*titans.length)];openGame('⚔️ TITAN BATTLE: '+t[0],`<p>${t[2]}</p><p><b>Victory Reward: +${t[1]} XP</b></p><button class="sp" id="winTitan">Titan Defeated!</button>`);document.getElementById('winTitan').addEventListener('click',()=>{if(!selected.size)return toast('Select one or more victorious heroes.');award(t[1],t[0]);celebrate('VICTORY!','⚔️ TITAN DEFEATED!','+'+t[1]+' XP • '+t[0]);closeGame()})}
function training(){let drills=["Explain a strategy to a partner.","Solve one challenge problem accurately.","Revise one answer after feedback.","Show CHAMPS expectations for the next activity.","Teach a fact or vocabulary word to a partner."];let d=drills[Math.floor(Math.random()*drills.length)];openGame('🏟️ TRAINING GROUNDS',`<p>${d}</p><p><b>Training Reward: +5 XP</b></p><button class="sp" id="finishTraining">Training Complete</button>`);document.getElementById('finishTraining').addEventListener('click',()=>{if(!selected.size)return toast('Select one or more heroes who trained.');award(5,'Training Grounds');closeGame()})}

function audioCtx(){window._ac=window._ac||new (window.AudioContext||window.webkitAudioContext)();return window._ac}
function tone(freq,dur,type='sine',vol=.12,delay=0){if(!soundOn)return;try{let a=audioCtx(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,a.currentTime+delay);g.gain.linearRampToValueAtTime(vol,a.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+delay+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+dur)}catch(e){}}
function playXPSound(){tone(523,.12,'sine',.10);tone(659,.16,'sine',.10,.10)}function playCoinSound(){tone(880,.10,'triangle',.10);tone(1175,.16,'triangle',.10,.08)}function playLevelSound(){[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.12,i*.12))}function playTimerSound(){[784,784,1047].forEach((f,i)=>tone(f,.3,'square',.08,i*.25))}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊 Sound On':'🔇 Sound Off';if(soundOn)playXPSound()}
function openTimer(){document.getElementById('timerPanel').classList.toggle('open')}function fmtTimer(){let m=Math.floor(timerRemaining/60),sec=timerRemaining%60;document.getElementById('timerDisplay').textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}function setTimer(sec){pauseTimer();timerRemaining=sec;fmtTimer()}function setCustomTimer(){let m=Number(document.getElementById('customMinutes').value);if(!Number.isFinite(m)||m<1)return toast('Enter 1–120 minutes.');m=Math.min(120,m);setTimer(Math.round(m*60))}function startTimer(){if(timerId||timerRemaining<=0)return;timerId=setInterval(()=>{timerRemaining--;fmtTimer();if(timerRemaining<=0){pauseTimer();playTimerSound();celebrate('TIME!','⏱️ TIMER COMPLETE','Ready for the next mission.')}},1000)}function pauseTimer(){if(timerId){clearInterval(timerId);timerId=null}}function resetTimer(){pauseTimer();timerRemaining=300;fmtTimer()}

render();fmtTimer();
</script></body></html>
